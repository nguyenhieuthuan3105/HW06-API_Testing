name: EShop Automated API Testing CI (FR-06, FR-09, FR-17)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run Newman API Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 3. Install Newman & HTML Extra Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra wait-on

      - name: 4. Clone and Start EShop Backend SUT
        run: |
          git clone https://github.com/ttbhanh/eshop-sut.git sut_backend
          cd sut_backend/backend
          npm install
          node server.js &
          npx wait-on tcp:3000 -t 30000

      - name: 5. Execute Newman Collections (FR-06, FR-09, FR-17)
        run: |
          mkdir -p reports
          echo "=== RUNNING FR-06 TESTS (Strict Verification without Suppress) ==="
          newman run postman/fr06_product_detail_collection.json \
            -e postman/eshop_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/fr06_newman_report.html

      - name: 6. Upload HTML Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-reports
          path: reports/*.html
          retention-days: 14
